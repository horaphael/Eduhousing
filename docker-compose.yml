services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: eduhousing
      POSTGRES_PASSWORD: eduhousing
      POSTGRES_DB: eduhousing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/base_db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  pgdata:
