name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eduhousing
          POSTGRES_PASSWORD: eduhousing
          POSTGRES_DB: eduhousing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U eduhousing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://eduhousing:eduhousing@localhost:5432/eduhousing

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run migrate
      - run: npm test
